name: E2E Tests

# End-to-end test of operator-managed mode (no Sentinel), the default mode.
# The job starts minikube, installs the chart from this checkout and tests a
# RedisFailover: master election, replication, a failover by the operator,
# and the endpoints of the master Service after it.
#
# The CI workflow calls this workflow on a pull request when a changed file
# can affect the test, and when the pull request changes a workflow file. The
# test of a changed workflow runs on the pull request that changes it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-sentinel-free:
    runs-on: ubuntu-latest
    # A full run takes about 6 minutes. The limit stops a step that waits
    # forever, for example on a command that never returns.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          kubernetes-version: v1.32.0

      - name: Build operator image
        run: |
          docker build -t redis-operator:e2e -f docker/app/Dockerfile .
          minikube image load redis-operator:e2e

      - name: Install CRD
        run: kubectl apply --server-side -f manifests/databases.spotahome.com_redisfailovers.yaml

      - name: Deploy operator
        run: |
          helm upgrade --install redis-operator ./charts/redisoperator \
            --set image.repository=redis-operator \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --wait --timeout=120s

      - name: Wait for operator ready
        run: |
          kubectl rollout status deployment/redis-operator --timeout=60s

      - name: Create RedisFailover with sentinel disabled
        run: |
          kubectl apply -f - <<EOF
          apiVersion: databases.spotahome.com/v1
          kind: RedisFailover
          metadata:
            name: test-no-sentinel
          spec:
            redis:
              replicas: 2
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 400m
                  memory: 512Mi
            sentinel:
              enabled: false
              failoverTimeout: "5s"
          EOF

      - name: Wait for Redis pods ready
        run: |
          echo "Waiting for Redis StatefulSet to be created..."
          for i in {1..60}; do
            if kubectl get statefulset rfr-test-no-sentinel 2>/dev/null; then
              break
            fi
            echo "Waiting for StatefulSet to be created... ($i/60)"
            sleep 5
          done

          # The StatefulSet uses OnDelete, because the operator replaces the
          # pods. `kubectl rollout status` supports only RollingUpdate. The
          # StatefulSet controller sets readyReplicas for each update strategy.
          echo "Waiting for Redis pods to become Ready..."
          kubectl wait --for=jsonpath='{.status.readyReplicas}'=2 statefulset/rfr-test-no-sentinel --timeout=180s

      - name: Verify NO Sentinel resources exist
        run: |
          echo "Verifying Sentinel resources do NOT exist..."

          # Check Sentinel Deployment does not exist
          if kubectl get deployment rfs-test-no-sentinel 2>/dev/null; then
            echo "✗ Sentinel Deployment exists but should not"
            exit 1
          fi
          echo "✓ No Sentinel Deployment"

          # Check Sentinel Service does not exist
          if kubectl get service rfs-test-no-sentinel 2>/dev/null; then
            echo "✗ Sentinel Service exists but should not"
            exit 1
          fi
          echo "✓ No Sentinel Service"

          # Check Sentinel ConfigMap does not exist
          if kubectl get configmap rfs-test-no-sentinel 2>/dev/null; then
            echo "✗ Sentinel ConfigMap exists but should not"
            exit 1
          fi
          echo "✓ No Sentinel ConfigMap"

      - name: Verify Redis resources exist
        run: |
          echo "Verifying Redis resources exist..."

          kubectl get statefulset rfr-test-no-sentinel
          echo "✓ Redis StatefulSet exists"

          kubectl get service rfrm-test-no-sentinel
          echo "✓ Master Service exists"

          kubectl get service rfrs-test-no-sentinel
          echo "✓ Slave Service exists"

      - name: Verify master is elected
        run: |
          source test/e2e/helpers.sh
          MASTER_POD=$(master_pod)
          echo "✓ Exactly one master: $MASTER_POD"

      - name: Write test data
        run: |
          source test/e2e/helpers.sh
          MASTER_POD=$(master_pod)
          for i in {1..100}; do
            redis_cli $MASTER_POD SET "key:$i" "value:$i" > /dev/null
          done
          echo "✓ Wrote 100 keys to $MASTER_POD"

      - name: Verify replication
        run: |
          source test/e2e/helpers.sh
          for pod in $PODS; do
            wait_until 60 "$pod does not have the 100 keys" has_test_data $pod || { echo "$pod: $(dbsize $pod) keys"; exit 1; }
            echo "✓ $pod ($(role $pod)): 100 keys"
          done

      - name: Test operator-managed failover
        run: |
          source test/e2e/helpers.sh
          MASTER_POD=$(master_pod)
          REPLICA_POD=$(other_pod $MASTER_POD)
          echo "Deleting master pod $MASTER_POD, so $REPLICA_POD must become master..."
          kubectl delete pod $MASTER_POD

          if ! wait_until 60 "Failover failed: $REPLICA_POD did not become master" is_master $REPLICA_POD; then
            kubectl logs -l app.kubernetes.io/name=redis-operator --tail=50 || true
            exit 1
          fi
          echo "✓ Failover complete: $REPLICA_POD is now master"

      - name: Wait for pod recovery
        run: |
          source test/e2e/helpers.sh
          # `kubectl wait` fails at once while the deleted pod has no
          # replacement, and it can find the old pod while it terminates.
          ready() { [[ "$(kubectl get pod $1 -o jsonpath='{.metadata.deletionTimestamp}/{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" == /True ]]; }
          for pod in $PODS; do
            wait_until 180 "$pod did not become Ready" ready $pod
            echo "✓ $pod is Ready"
          done

      - name: Verify data survived failover
        run: |
          source test/e2e/helpers.sh
          # The replacement pod starts empty and gets the keys from the new
          # master. A pod without all keys shows lost writes.
          for pod in $PODS; do
            wait_until 60 "$pod does not have the 100 keys" has_test_data $pod || { echo "$pod: $(dbsize $pod) keys"; exit 1; }
            VALUE=$(redis_cli $pod GET "key:50" 2>/dev/null || true)
            if [[ "$VALUE" != "value:50" ]]; then
              echo "✗ $pod: key:50 = '$VALUE', expected 'value:50'"
              exit 1
            fi
            echo "✓ $pod has test data (key:50 = $VALUE)"
          done

      - name: Verify master service endpoints
        run: |
          source test/e2e/helpers.sh
          # The endpoints follow the role label, which the operator sets
          # after the promotion.
          endpoint_is_master() {
            local pod
            pod=$(master_pod 2>/dev/null) || return 1
            MASTER_IP=$(kubectl get pod $pod -o jsonpath='{.status.podIP}')
            ENDPOINTS=$(kubectl get endpoints rfrm-test-no-sentinel -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)
            [[ -n "$MASTER_IP" && "$ENDPOINTS" == "$MASTER_IP" ]]
          }
          if ! wait_until 60 "Master service endpoints do not match the master" endpoint_is_master; then
            echo "Master IP: '$MASTER_IP', endpoints: '$ENDPOINTS'"
            master_pod || true
            exit 1
          fi
          echo "✓ Master service points to the master ($MASTER_IP)"

      - name: Test clients of a demoted master move to the new master
        run: |
          source test/e2e/helpers.sh
          # redis-cli -r keeps one connection open and reconnects as soon as it is closed.
          kubectl run demotion-client --image=redis:7.2.12-alpine --image-pull-policy=IfNotPresent --restart=Never --command -- \
            sh -c 'while true; do redis-cli -h rfrm-test-no-sentinel -r -1 -i 0.01 INCR e2e:demotion; sleep 0.01; done'
          kubectl wait --for=condition=Ready pod/demotion-client --timeout=60s

          writing() { local out; out=$(kubectl logs demotion-client --tail=5); [[ -n "$out" ]] && ! grep -qvE '^[0-9]+$' <<<"$out"; }
          readonly_errors() { kubectl logs demotion-client | grep -c READONLY || true; }
          labelled_slave() { [[ "$(kubectl get pod $1 -o jsonpath='{.metadata.labels.redisfailovers-role}')" == slave ]]; }
          counter() { redis_cli $1 GET e2e:demotion 2>/dev/null | tr -dc '0-9'; }
          writes_reach() { local before after; before=$(counter $1); sleep 2; after=$(counter $1); (( ${after:-0} > ${before:-0} )); }
          for i in {1..30}; do writing && break; sleep 2; done
          writing || { echo "✗ Client never wrote to the master"; kubectl logs demotion-client --tail=20; exit 1; }

          # Both directions, since the operator relabels pods in list order.
          for round in 1 2; do
            OLD_MASTER=$(master_pod)
            NEW_MASTER=$(other_pod $OLD_MASTER)
            echo "Round $round: demoting $OLD_MASTER in favour of $NEW_MASTER"
            ERRORS_BEFORE=$(readonly_errors)
            NEW_MASTER_IP=$(kubectl get pod $NEW_MASTER -o jsonpath='{.status.podIP}')
            # While both pods are masters, the operator can keep OLD_MASTER, which has the
            # master label. The commands run together, so that this time is short.
            redis_cli $NEW_MASTER REPLICAOF NO ONE &
            PROMOTE=$!
            redis_cli $OLD_MASTER REPLICAOF $NEW_MASTER_IP 6379
            wait $PROMOTE

            wait_until 90 "The operator did not label $OLD_MASTER as slave" labelled_slave $OLD_MASTER
            MOVED=false
            for i in {1..10}; do
              sleep 3
              if writing && (( $(readonly_errors) > ERRORS_BEFORE )); then MOVED=true; break; fi
            done
            if [[ "$MOVED" != true ]]; then
              echo "✗ Client still stuck on the demoted master"
              kubectl logs demotion-client --tail=20
              exit 1
            fi
            # A client also writes again when the operator makes the old
            # master the master again. Only the writes on NEW_MASTER show
            # that the client moved.
            if ! is_master $NEW_MASTER; then
              echo "✗ $NEW_MASTER is '$(role $NEW_MASTER)', expected master"
              exit 1
            fi
            wait_until 30 "The client writes do not reach $NEW_MASTER" writes_reach $NEW_MASTER
            echo "✓ Client reconnected to the new master"
          done

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -l app.kubernetes.io/name=redis-operator --tail=100 || true
          echo "=== Redis pod 0 logs ==="
          kubectl logs rfr-test-no-sentinel-0 --tail=50 || true
          echo "=== Redis pod 1 logs ==="
          kubectl logs rfr-test-no-sentinel-1 --tail=50 || true
          echo "=== Pod descriptions ==="
          kubectl describe pod -l redisfailovers.databases.spotahome.com/name=test-no-sentinel || true
          echo "=== Services ==="
          kubectl get svc | grep test-no-sentinel || true
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -30
