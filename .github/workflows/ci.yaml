name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    # On a pull request, the action reads the changed files with the REST API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      codegen: ${{ steps.filter.outputs.codegen }}
      unit: ${{ steps.filter.outputs.unit }}
      integration: ${{ steps.filter.outputs.integration }}
      chart: ${{ steps.filter.outputs.chart }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A job runs when a changed file matches a rule of its filter. Each
          # filter has the workflow files, so a change to a workflow runs the
          # jobs. Documentation and metadata files match no rule.
          filters: |
            # Build and lint.
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci*'
              - '.github/workflows/**'
            # Also compares the CRD files, as listed in CRD_MANIFESTS in the
            # Makefile, with the generated files.
            codegen:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'manifests/databases.spotahome.com_redisfailovers.yaml'
              - 'manifests/kustomize/base/databases.spotahome.com_redisfailovers.yaml'
              - 'charts/redisoperator/crds/databases.spotahome.com_redisfailovers.yaml'
              - '.github/workflows/**'
            # The tests in api/ and operator/ read example/redisfailover. The
            # Codecov service applies codecov.yml to the coverage upload of
            # this job.
            unit:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'example/**'
              - 'codecov.yml'
              - '.github/workflows/**'
            # The job applies the CRD file of the operator.
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'manifests/databases.spotahome.com_redisfailovers.yaml'
              - '.github/workflows/**'
            # scripts/helm-tests.sh reads the chart, manifests/kustomize,
            # example/operator, scripts/release.sh and release.yml.
            chart:
              - 'charts/**'
              - 'manifests/**'
              - 'scripts/**'
              - 'example/**'
              - 'Makefile'
              - '.github/workflows/**'
            # The Dockerfile builds the binaries with scripts/build.sh.
            docker:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'docker/**'
              - '.dockerignore'
              - 'scripts/**'
              - '.github/workflows/**'
            # The test builds the image and installs the chart and the CRD.
            e2e:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'docker/**'
              - '.dockerignore'
              - 'scripts/**'
              - 'charts/**'
              - 'manifests/**'
              - 'test/**'
              - '.github/workflows/**'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build redis-operator
        run: go build -v ./cmd/redisoperator
      - name: Build redis-instance
        run: go build -v ./cmd/instance

  check:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=15m

  verify-codegen:
    name: Verify generated code
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install controller-gen
        run: make install-controller-gen
      - run: make verify-codegen

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install redis-server (for service/redis unit tests)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: make ci-unit-test-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false     

  integration-test:
    name: Integration test
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # No `needs` on check or unit-test: this matrix does not use their
    # output, so it runs in parallel with them.
    strategy:
      matrix:
        kubernetes: [1.35.8, 1.36.4, 1.37.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pre-pull redis image in the background
        # With driver=none, the pods run on the docker daemon of this runner.
        # The tests use this default Redis image. The pull runs in parallel
        # with the minikube and CRD steps below.
        run: |
          docker pull redis:7.2.12-alpine &
          echo "REDIS_PULL_PID=$!" >> "$GITHUB_ENV"
      - name: Install conntrack
        run: sudo apt-get install -y conntrack
      - name: Prepare CNI config directory
        # With driver=none, medyagh/setup-minikube runs chmod on
        # /etc/cni/net.d, but it does not create it. The ubuntu-24.04
        # runners do not have this directory.
        run: sudo mkdir -p /etc/cni/net.d
      - uses: medyagh/setup-minikube@v0.0.21
        with:
          kubernetes-version: ${{ matrix.kubernetes }}
          minikube-version: 1.39.0
          driver: none
          # The default runtime of minikube 1.39.0 is containerd. With
          # driver=none, crictl cannot reach the containerd CRI socket.
          # This job installs docker and cri-dockerd.
          container-runtime: docker
      - name: Add redisfailover CRD
        run: kubectl create -f manifests/databases.spotahome.com_redisfailovers.yaml
      - name: Wait for redis image pre-pull to finish
        # $REDIS_PULL_PID is not a child of the shell of this step, so
        # `wait` cannot wait for it.
        run: |
          while kill -0 "$REDIS_PULL_PID" 2>/dev/null; do
            sleep 1
          done
      - run: make ci-integration-test

  chart-test:
    name: Chart testing
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.7.2
      - name: Helm test
        run: make helm-test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [changes, build, unit-test]
    # A skipped build or unit-test job does not skip this job. A failed or
    # cancelled job does.
    if: >-
      !cancelled() && needs.changes.outputs.docker == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.unit-test.result)
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: downcase REPO
        # Image names must be lower case, and GitHub has no lower-case
        # expression: https://github.com/orgs/community/discussions/25768
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ env.REPO }}:${{ github.sha }}

  e2e:
    name: E2E
    needs: changes
    # The test runs on pull requests only, not on a push to main.
    if: github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
