---
apiVersion: v1
kind: ConfigMap
metadata:
  name: startup-config
data:
  startup.sh: |
    #!/bin/bash
    # A Redis that loads its dataset answers LOADING. The kubelet restarts the
    # container when this probe fails, and the restart starts the load again.
    redis-cli -h 127.0.0.1 -p ${REDIS_PORT} --user pinger --pass pingpass --no-auth-warning ping | grep -qE '^(PONG|LOADING)'
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redisfailover
spec:
  sentinel:
    enabled: true
    replicas: 3
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 100Mi
  redis:
    replicas: 3
    startupConfigMap: startup-config
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 400m
        memory: 500Mi
