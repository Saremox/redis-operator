apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redisfailover
spec:
  redis:
    replicas: 3
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 1Gi
    maxMemory:
      percent: 75
      policy: noeviction
    autoscaling:
      mode: Recommend
      memoryMax: 4Gi
