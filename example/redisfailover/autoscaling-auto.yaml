apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redisfailover
spec:
  redis:
    replicas: 3
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 1Gi
    maxMemory:
      percent: 75
      policy: noeviction
    autoscaling:
      # Auto raises the memory limit of the pods in place, up to memoryMax.
      # It needs Kubernetes 1.33 or later, and a request equal to the limit
      # or no request.
      mode: Auto
      memoryMax: 4Gi
