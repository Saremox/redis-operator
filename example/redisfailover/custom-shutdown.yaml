apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redisfailover
spec:
  sentinel:
    enabled: true
    replicas: 3
  redis:
    replicas: 3
    shutdownConfigMap: "shutdown-configmap"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shutdown-configmap
data:
  shutdown.sh: |
    echo "shutdown in progress..."
    master=$(redis-cli -h rfs-redisfailover -p 26379 --csv SENTINEL get-master-addr-by-name mymaster | tr ',' ' ' | tr -d '\"' |cut -d' ' -f1)
    redis-cli SAVE
    if [ "$master" = "$(hostname -i)" ]; then
      redis-cli -h rfs-redisfailover -p 26379 SENTINEL failover mymaster
    fi
