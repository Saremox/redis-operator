apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redisfailover
spec:
  sentinel:
    enabled: true
    replicas: 3
  redis:
    replicas: 3
    shutdownConfigMap: "shutdown-configmap"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shutdown-configmap
data:
  # The preStop hook runs this script with /bin/sh. Change 6379 if you set
  # redis.port, and add your commands at the end.
  shutdown.sh: |
    # A call that hangs must not use up the grace period before the SAVE.
    t=; command -v timeout >/dev/null 2>&1 && t="timeout 2"
    sentinel="$t redis-cli -h rfs-redisfailover -p 26379"
    # Sentinel has no password, so only the local calls send REDIS_PASSWORD.
    local_cli() {
      if [ -n "${REDIS_PASSWORD}" ]; then
        REDISCLI_AUTH="${REDIS_PASSWORD}" $t redis-cli -p 6379 "$@"
      else
        $t redis-cli -p 6379 "$@"
      fi
    }
    master_ip() {
      $sentinel --csv SENTINEL get-master-addr-by-name mymaster | tr ',' ' ' | tr -d '"' | cut -d' ' -f1
    }
    # Prints the number of online replicas that did not confirm the offset of the master.
    replicas_behind() {
      info=$(local_cli INFO replication | tr -d '\r')
      top=""
      for line in $info; do
        case "$line" in
        master_repl_offset:*) top=${line#*:} ;;
        esac
      done
      [ -n "$top" ] || return
      n=0
      for line in $info; do
        case "$line" in
        slave*state=online,offset=*)
          offset=${line#*,offset=}
          if [ "${offset%%,*}" -lt "$top" ]; then n=$((n + 1)); fi ;;
        esac
      done
      echo "$n"
    }
    deadline=$(($(date +%s) + 12))
    self=$(hostname -i)
    # A failover without a write pause loses the writes that the replica did not get.
    if [ "$(master_ip)" = "$self" ] && [ "$(local_cli CLIENT PAUSE 15000 WRITE)" = "OK" ]; then
      # Sentinel can promote a replica that did not get the last writes. Thus wait
      # at most 4 seconds until the online replicas confirm all writes.
      while [ "$(replicas_behind)" != 0 ] && [ "$(date +%s)" -lt "$((deadline - 8))" ]; do
        sleep 0.1
      done
      if [ "$($sentinel SENTINEL failover mymaster)" = "OK" ]; then
        while [ "$(master_ip)" = "$self" ] && [ "$(date +%s)" -lt "$deadline" ]; do
          sleep 1
        done
        master=$(master_ip)
        # As a replica, this pod gives READONLY to the clients when the pause ends.
        if [ -n "$master" ] && [ "$master" != "$self" ]; then
          local_cli REPLICAOF "$master" 6379
        fi
      fi
      local_cli CLIENT UNPAUSE
    fi
    # The SAVE has no time limit, so that it can write all the data.
    t=
    local_cli SAVE
