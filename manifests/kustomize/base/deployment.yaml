apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-operator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    spec:
      enableServiceLinks: false
      containers:
        - name: redis-operator
          image: ghcr.io/saremox/redis-operator:4.2.0-rc2
          imagePullPolicy: IfNotPresent
          # The init container of redis.instanceManager copies the
          # redis-instance binary out of this image, so the operator
          # must know its own image name.
          env:
            - name: OPERATOR_IMAGE_NAME
              value: ghcr.io/saremox/redis-operator:4.2.0-rc2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Always
