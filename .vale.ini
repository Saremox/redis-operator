# Checks the mechanical rules of docs/writing.md (ASD-STE100). Vale cannot
# check the -ing form or the passive voice without a part-of-speech tagger, so
# these two rules stay a matter for the reviewer.
StylesPath = .vale/styles
MinAlertLevel = warning

[{README.md,AGENTS.md,CLAUDE.md,docs/*.md,.claude/**/*.md}]
BasedOnStyles = STE
