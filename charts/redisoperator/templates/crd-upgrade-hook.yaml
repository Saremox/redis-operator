{{- if .Values.crds.upgradeHook.enabled }}
{{- $fullName := include "chart.fullname" . -}}
{{- $hookName := printf "%s-crds-upgrade" $fullName -}}
{{- $data := dict "Chart" .Chart "Release" .Release "Values" .Values -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-crds
  namespace: {{ include "chart.namespaceName" . }}
  labels:
    {{- include "chart.labels" $data | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
# The CRD YAML is over the 1MiB a ConfigMap holds; compact JSON fits.
data:
  {{- range $path, $_ := .Files.Glob "crds/*.yaml" }}
  {{ base $path | trimSuffix ".yaml" }}.json: {{ $.Files.Get $path | fromYaml | toJson | quote }}
  {{- end }}
---
# The hook Job has its own ServiceAccount and ClusterRole. The operator
# ServiceAccount can change pods and services, and read secrets. The Job runs
# a third-party image and only applies one CRD, so it must not get these
# permissions. It can create a CRD, but it can read and change only the CRD
# of this chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ include "chart.namespaceName" . }}
  labels:
    {{- include "chart.labels" $data | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $hookName }}
  labels:
    {{- include "chart.labels" $data | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  # resourceNames limits get, update and patch to the CRD of this chart.
  # RBAC cannot limit create by resourceNames, because the object does not
  # exist at the authorization. Thus this identity can create any CRD.
  # `kubectl apply` needs create for the first install.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - redisfailovers.databases.spotahome.com
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $hookName }}
  labels:
    {{- include "chart.labels" $data | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ include "chart.namespaceName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $hookName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName }}
  namespace: {{ include "chart.namespaceName" . }}
  labels:
    {{- include "chart.labels" $data | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" $data | nindent 8 }}
    spec:
      serviceAccountName: {{ $hookName }}
      restartPolicy: Never
      enableServiceLinks: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "chart.imagePullSecrets" (dict "root" . "secret" (printf "%s-registry" $hookName)) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: crds-upgrade
          image: "{{ .Values.crds.upgradeHook.image.repository }}:{{ .Values.crds.upgradeHook.image.tag | default "v1.36.2" }}"
          imagePullPolicy: {{ .Values.crds.upgradeHook.image.pullPolicy }}
          # Server-side, as the CRD is too large for the last-applied
          # annotation of a client-side apply. The root filesystem can be
          # read-only, so the discovery cache goes to an emptyDir.
          command:
            - kubectl
            - apply
            - --server-side
            - --force-conflicts
            - --cache-dir=/cache
            {{- range $path, $_ := .Files.Glob "crds/*.yaml" }}
            - -f
            - /crds/{{ base $path | trimSuffix ".yaml" }}.json
            {{- end }}
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
            - name: cache
              mountPath: /cache
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.crds.upgradeHook.resources | nindent 12 }}
      volumes:
        - name: crds
          configMap:
            name: {{ $fullName }}-crds
        - name: cache
          emptyDir: {}
{{- if (and .Values.imageCredentials.create (not .Values.imageCredentials.existsSecrets)) }}
---
# Helm creates the registry Secret of the chart after the pre-install hooks,
# so the hook Job pulls its image with this copy.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hookName }}-registry
  namespace: {{ include "chart.namespaceName" . }}
  labels:
    {{- include "chart.labels" $data | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
{{- end }}
