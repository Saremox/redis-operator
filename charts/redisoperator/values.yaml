# Default values for redis-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Name of the image repository to pull the container image from.
image:
  repository: ghcr.io/saremox/redis-operator
  pullPolicy: IfNotPresent
  tag: ""
  # Extra arguments of the operator, one flag in each item. A string is split
  # at whitespace. The chart sets `--listen-address` from container.port.
  cli_args: []

imageCredentials:
  # true gives the operator pod and the CRD upgrade hook pod image pull secrets:
  # the existsSecrets, or if existsSecrets is empty, a Secret that the chart
  # creates from registry, username, password and email. The chart stops when
  # username or password has the placeholder value below.
  create: false
  registry: url.private.registry
  username: someone
  password: somepassword
  email: someone@example.com
  # Names of pull Secrets that exist in the namespace. Example: [registrysecret]
  existsSecrets: []

updateStrategy:
  type: RollingUpdate

replicas: 1

# A name in place of the chart name for `app:` labels.
nameOverride: ""

# A name to substitute for the full names of resources.
fullnameOverride: ""

# The name of the Namespace to deploy
# If not set, `.Release.Namespace` is used
namespace: null

serviceAccount:
  # true creates the ServiceAccount, the ClusterRole and the ClusterRoleBinding.
  # false skips all three. You must then give the operator its RBAC permissions.
  create: true
  # Annotations to be added to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

service:
  type: ClusterIP
  # The Service forwards this port to container.port.
  port: 9710

container:
  # The operator serves its metrics on this port. The probes use it too.
  port: 9710

# Container [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1) for details.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: 
      - ALL

# Pod [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context) for details.
podSecurityContext:
  fsGroup: 1000

# Container resource [requests and limits](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
# See the [API reference](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources) for details.
# @default -- No requests or limits.
resources: {}
#   requests:
#     cpu: 100m
#     memory: 128Mi
#   limits:
#     cpu: 100m
#     memory: 128Mi

### Monitoring
###############
monitoring:
  # Create a metrics Service for the operator, and with serviceMonitor, a
  # Prometheus ServiceMonitor.
  enabled: false
  serviceMonitor: false
  serviceAnnotations: {}
  prometheus:
    name: unknown

# Annotations to be added to pods and deployments.
annotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

priorityClassName: ""

# CustomResourceDefinition lifecycle.
crds:
  # Helm only installs the contents of a chart's crds/ directory on the first
  # `helm install` - it never touches them again on `helm upgrade`
  # (https://helm.sh/docs/chart_best_practices/custom_resource_definitions/).
  # On a long-lived cluster this lets the live CRD schema silently drift
  # behind the chart: the API server prunes spec fields it doesn't recognize
  # (e.g. a newly added field) instead of erroring, which looks like the
  # operator ignoring your changes rather than a stale CRD.
  #
  # Enabling this runs `kubectl apply` on the CRD bundled with this chart
  # version as a pre-install/pre-upgrade Helm hook. The hook Job has its own
  # ServiceAccount and ClusterRole, not the operator's. Disabled by default
  # because it grants a Helm hook Job permission to modify a cluster-scoped
  # resource - review before enabling on a shared cluster.
  #
  # The hook Job uses the securityContext and podSecurityContext of the operator,
  # so it can run in a namespace where the operator can run.
  upgradeHook:
    enabled: false
    image:
      repository: rancher/kubectl
      # Defaults to v1.36.2.
      tag: ""
      pullPolicy: IfNotPresent
    # Resource requests and limits for the hook Job's container.
    resources: {}

