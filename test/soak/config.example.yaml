# Example soak tester configuration. Every field except the instance list
# has a default, shown here.

# The operator Deployment whose image tag is exported as
# redis_soak_build_info{operator_version}.
operator:
  namespace: redis-operator
  deployment: redis-operator

probe:
  interval: 1s
  # Per command, including the dial of a fresh connection. The observer
  # uses it for its INFO and SENTINEL commands too.
  timeout: 1s
  # Every waitEvery-th successful SET is followed by WAIT 1 waitTimeout
  # (op="wait"). waitTimeout defaults to half the timeout.
  waitEvery: 10
  waitTimeout: 500ms

observer:
  # How often each instance's invariants are checked.
  interval: 5s
  # How long an instance may take to converge after its spec changed
  # (metadata.generation) or a mutation, before a violation counts as a
  # finding.
  convergenceTimeout: 10m

# The mutator changes each instance with a mutations section, one mutation
# at a time, once the instance is quiet: no convergence window open and
# every invariant holding.
mutation:
  # false switches the mutator off.
  enabled: true
  # The pause after a mutation converged, plus up to jitter at random.
  interval: 2m
  jitter: 0s
  # The least time a mutation's convergence window stays open, so a change
  # the operator hasn't picked up yet isn't taken as converged.
  minDwell: 15s
  # Every pick is reproducible from the seed and the step logged with each
  # mutation. 0 (the default) picks a seed at startup and logs it.
  seed: 0
  # Stop starting mutations this long after startup, for runs of a fixed
  # length. 0s never stops.
  stopAfter: 0s

# Each instance is a RedisFailover the tester probes and observes.
instances:
  - name: op-basic
    namespace: op-basic
    # operator (sentinel.enabled: false): probed through rfrm-<name>.
    # sentinel: probed through Sentinel (rfs-<name>:26379, mymaster) and
    # through rfrm-<name>.
    mode: operator
    # spec.redis.port
    port: 6379
    # The spec.redis.maxMemory.policy the instance is created with; empty
    # (the default) without maxMemory.
    maxMemoryPolicy: ""
    # Without data, nothing is written but the probes' keys.
    data:
      # The filler keeps used_memory at percent of maxmemory, or at sizeMi
      # without maxmemory, writing soak:<rf>:fill:<n> through rfrm.
      fill:
        percent: 50
        sizeMi: 32
        valueBytes: 1024
        keysPerSecond: 1000
        # Keys per pipeline.
        batch: 50
        # A TTL on fill keys; needed with a ledger under volatile-*, so
        # only fill keys are evicted. 0s sets none.
        ttl: 0s
        # Fill keys checked per verification.
        sampleKeys: 100
      # The ledger writes soak:<rf>:ledger:<seq> and verifies every
      # acknowledged write after each failover and mutation. Its keys must
      # never be evicted: it is rejected on instances that may run under
      # allkeys-*, and under volatile-* without fill.ttl. Omit it for a
      # fill-only instance.
      ledger:
        writesPerSecond: 10
        valueBytes: 64
        # Keys from before the previous verification checked again.
        sampleKeys: 100
        # Verify when no event did for this long.
        verifyInterval: 10m
    # Without mutations, an instance is only probed and observed.
    mutations:
      # The enabled kinds and their weights:
      # - redis_replicas: spec.redis.replicas, within redisReplicas.
      # - sentinel_replicas (sentinel only): spec.sentinel.replicas, within
      #   sentinelReplicas.
      # - redis_resources: the redis container's cpu, memory or both, within
      #   resources.
      # - kill_master, kill_replica, kill_sentinel (sentinel only): delete
      #   one such pod; kill_master gracefully.
      # - kill_master_force: delete the master with GracePeriodSeconds=0.
      # - redis_memory, maxmemory_policy, maxmemory_percent, fill_burst
      #   (maxMemoryPolicy instances only): see op-noevict below.
      # - password_rotate, auth_add, auth_remove, password_rotate_offline:
      #   see op-full below.
      # - sentinel_toggle: flip spec.sentinel.enabled; the probe paths
      #   follow.
      kinds:
        redis_replicas: 2
        redis_resources: 2
        kill_master: 1
        kill_master_force: 1
        kill_replica: 1
      # At least 1.
      redisReplicas: {min: 1, max: 5}
      # Only the requests and limits the RedisFailover already sets are
      # changed, so the operator can resize the pods in place. cpu is in
      # millicores and memory in Mi. A request's range must lie below its
      # limit's, so the QoS class can't change, and a memory limit must be
      # at least 64Mi, and with data at least twice fill.sizeMi plus 32Mi.
      # On maxMemoryPolicy instances with data only cpu: their memory is
      # redis_memory's.
      resources:
        requests:
          cpu: {min: 25, max: 200}
          memory: {min: 32, max: 128}
        limits:
          memory: {min: 192, max: 512}
      # The share of replica and Sentinel kills that delete with
      # GracePeriodSeconds=0.
      forceDeleteProbability: 0.5
  - name: sent-basic
    namespace: sent-basic
    mode: sentinel
    mutations:
      kinds:
        redis_replicas: 2
        sentinel_replicas: 1
        kill_master: 2
        kill_replica: 1
        kill_sentinel: 1
        sentinel_toggle: 1
      redisReplicas: {min: 1, max: 5}
      # At least 3.
      sentinelReplicas: {min: 3, max: 5}
      forceDeleteProbability: 0.5
  - name: op-noevict
    namespace: op-noevict
    mode: operator
    maxMemoryPolicy: noeviction
    data:
      fill: {percent: 70, ttl: 24h}
      ledger: {}
    mutations:
      kinds:
        # The redis container's memory limit within redisMemory (Mi), and a
        # memory request in proportion.
        redis_memory: 2
        # spec.redis.maxMemory.policy, to another of maxMemoryPolicies.
        maxmemory_policy: 1
        # spec.redis.maxMemory.percent within maxMemoryPercent (10-95).
        maxmemory_percent: 2
        # Write past maxmemory until rejected, keep trying for
        # fillBurstHold, then delete the burst's keys. noeviction only.
        fill_burst: 2
      redisMemory: {min: 128, max: 256}
      maxMemoryPolicies: [noeviction, volatile-lru, volatile-ttl]
      maxMemoryPercent: {min: 10, max: 95}
      fillBurstHold: 10s
  # Every client authenticates while the RedisFailover has
  # spec.auth.secretPath, with the Secret's current password.
  - name: op-full
    namespace: op-full
    mode: operator
    # The Secret auth_add creates or updates and names in
    # spec.auth.secretPath; default <name>-auth.
    authSecret: op-full-auth
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        # A new random password in the Secret spec.auth.secretPath names.
        password_rotate: 2
        # Set or remove spec.auth.secretPath; auth_add creates authSecret.
        auth_add: 1
        auth_remove: 1
        # Scenario C: rotate while the operator is scaled to 0, expect
        # "unable to apply the configured password", put the previous
        # password back, expect Healthy, rotate again. It pauses every
        # other instance's mutations.
        password_rotate_offline: 1
  # Replicates from op-basic's master: spec.bootstrapNode.host is the
  # ClusterIP of rfrm-op-basic. Read-only, so it has no data; it is probed
  # through rfrs by reading what op-basic's probes write.
  - name: bootstrap
    namespace: bootstrap
    mode: operator
    bootstrap:
      # A configured instance with a ledger.
      source: op-basic
      # op-basic's ledger keys read from every pod per verification.
      sampleKeys: 100
      # Verify when no mutation did for this long.
      verifyInterval: 1m
    mutations:
      # Only redis_replicas, redis_resources and kill_replica.
      kinds:
        redis_replicas: 1
        kill_replica: 1
      redisReplicas: {min: 1, max: 3}
