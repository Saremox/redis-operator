# Example soak tester configuration. All fields except the instance list
# have a default, which this file shows.

# The operator Deployment, whose image tag the tester exports as
# redis_soak_build_info{operator_version}, and the Lease of its leader.
operator:
  namespace: redis-operator
  deployment: redis-operator
  lease: redis-failover-lease

probe:
  interval: 1s
  # For each command, including the dial of a fresh connection. The
  # observer also uses it for its INFO and SENTINEL commands.
  timeout: 1s
  # A successful SET whose sequence number is a multiple of waitEvery is
  # followed by WAIT 1 waitTimeout (op="wait"). The default waitTimeout is
  # half of timeout.
  waitEvery: 10
  waitTimeout: 500ms

observer:
  # How often the observer checks the invariants of each instance.
  interval: 5s
  # How long an instance can take to converge after a spec change
  # (metadata.generation) or a mutation, before a violation is a finding.
  convergenceTimeout: 10m
  # A Ready replica whose link is down and was never up since it started
  # (replica_ready_without_data) is a finding. false only reports it, for
  # operators whose readiness probe passes such a replica.
  replicaReadyWithoutData: true

# The mutator changes each instance that has a mutations section, with one
# mutation at a time, when the instance is quiet: no convergence window is
# open and all invariants hold.
mutation:
  # false disables the mutator.
  enabled: true
  # The pause after a mutation converged, plus up to jitter at random.
  interval: 2m
  jitter: 0s
  # The minimum time that the convergence window of a mutation stays open.
  # Without it, a change that the operator did not see yet can look
  # converged.
  minDwell: 15s
  # You can reproduce each pick from the seed and the step that the log
  # line of each mutation has. 0 (the default) picks a seed at startup and
  # logs it.
  seed: 0
  # No new mutations after this time from startup, for runs of a fixed
  # length. 0s never stops.
  stopAfter: 0s
  # Convergence timeouts of kinds that take longer than
  # observer.convergenceTimeout, counted from applying the mutation: base
  # (default observer.convergenceTimeout) plus perPod for every redis pod.
  # These are the defaults.
  timeouts:
    image_upgrade: {perPod: 2m}
    sentinel_image_upgrade: {perPod: 1m}
    reset: {perPod: 1m}

# The chaos lane does cluster-level actions, one at a time, on all
# instances together, every interval plus up to jitter. It picks the kind
# by weight from mutation.seed, and stops at mutation.stopAfter. While an
# action runs, all mutators wait and all instances are in a convergence
# window.
chaos:
  # No kinds (the default) disables the lane.
  kinds:
    # Delete the operator pod.
    operator_restart: 1
    # helm upgrade the operator to each other version in turn, and back.
    operator_upgrade: 1
    # Cordon and drain a node, hold it, uncordon it.
    node_drain: 1
  interval: 10m
  jitter: 0s
  # The limit of each wait of an action. Default: observer.convergenceTimeout.
  timeout: 10m
  upgrade:
    release: redis-operator
    helm: helm
    # Added to each upgrade. Each upgrade also reuses the values of the release.
    set: [crds.upgradeHook.enabled=true]
    # The CRD hook Job of the chart. Default: <release>-crds-upgrade.
    hookJob: redis-operator-crds-upgrade
    timeout: 10m
    # An OCI chart with its version, or a chart archive or directory
    # relative to this file; image is the operator's, repository:tag.
    versions:
      - name: 4.2.0-rc2
        chart: oci://ghcr.io/saremox/redis-operator/charts/redis-operator
        version: 4.2.0-rc2
        image: ghcr.io/saremox/redis-operator:4.2.0-rc2
      - name: 4.2.0-rc3
        chart: oci://ghcr.io/saremox/redis-operator/charts/redis-operator
        version: 4.2.0-rc3
        image: ghcr.io/saremox/redis-operator:4.2.0-rc3
  drain:
    # The nodes that a drain can pick. Never the node of the tester.
    nodeSelector: "!node-role.kubernetes.io/control-plane"
    # How long the node stays cordoned once drained.
    hold: 1m
    # Evictions a PodDisruptionBudget blocks are retried this long.
    timeout: 5m

# The server versions in the rotation, by the names that label the
# metrics, each pinned to an exact patch tag. server and release are what
# INFO server reports. Their defaults are the repository name of the image,
# and the tag up to its first '-'.
versions:
  - {name: redis-7.2, image: "redis:7.2.16-alpine"}
  - {name: valkey-7.2, image: "valkey/valkey:7.2.14-alpine"}
  - {name: valkey-8, image: "valkey/valkey:8.1.10-alpine"}
# The transition graph. expect is ok, fail or unknown. The tester observes
# a change along an edge that is not ok until it converges, for a maximum
# of timeout (default: the timeout of the kind), or for one minute after a
# pod on the new version could not load the data. It then judges the
# change. Downgrades are not edges: a chain goes back with a reset.
edges:
  - {from: redis-7.2, to: valkey-7.2, expect: ok}
  - {from: redis-7.2, to: valkey-8, expect: ok}
  - {from: valkey-7.2, to: valkey-8, expect: ok}

# Each instance is a RedisFailover the tester probes and observes.
instances:
  - name: op-basic
    namespace: op-basic
    # operator (sentinel.enabled: false): probed through rfrm-<name>.
    # sentinel: probed through Sentinel (rfs-<name>:26379, mymaster) and
    # through rfrm-<name>.
    mode: operator
    # spec.redis.port
    port: 6379
    # The spec.redis.maxMemory.policy the instance is created with; empty
    # (the default) without maxMemory.
    maxMemoryPolicy: ""
    # Without data, nothing is written but the probes' keys.
    data:
      # The filler keeps used_memory at percent of maxmemory, or at sizeMi
      # without maxmemory, writing soak:<rf>:fill:<n> through rfrm.
      fill:
        percent: 50
        sizeMi: 32
        valueBytes: 1024
        keysPerSecond: 1000
        # Keys per pipeline.
        batch: 50
        # A TTL on fill keys; needed with a ledger under volatile-*, so
        # only fill keys are evicted. 0s sets none.
        ttl: 0s
        # Fill keys checked per verification.
        sampleKeys: 100
      # The ledger writes soak:<rf>:ledger:<seq> and verifies every
      # acknowledged write after each failover and mutation. Its keys must
      # never be evicted: it is rejected on instances that may run under
      # allkeys-*, and under volatile-* without fill.ttl. Omit it for a
      # fill-only instance.
      ledger:
        writesPerSecond: 10
        valueBytes: 64
        # Keys from before the previous verification checked again.
        sampleKeys: 100
        # Verify when no event did for this long.
        verifyInterval: 10m
    # Without mutations, an instance is only probed and observed.
    mutations:
      # The enabled kinds and their weights:
      # - redis_replicas: spec.redis.replicas, within redisReplicas.
      # - sentinel_replicas (sentinel only): spec.sentinel.replicas, within
      #   sentinelReplicas.
      # - redis_resources: the cpu, the memory or both of the redis
      #   container, within resources.
      # - kill_master, kill_replica, kill_sentinel (sentinel only): delete
      #   one such pod; kill_master gracefully.
      # - kill_master_force: delete the master with GracePeriodSeconds=0.
      # - redis_memory, maxmemory_policy, maxmemory_percent, fill_burst
      #   (maxMemoryPolicy instances only): see op-noevict below.
      # - password_rotate, auth_add, auth_remove, password_rotate_offline:
      #   see op-full below.
      # - sentinel_toggle: flip spec.sentinel.enabled; the probe paths
      #   follow.
      kinds:
        redis_replicas: 2
        redis_resources: 2
        kill_master: 1
        kill_master_force: 1
        kill_replica: 1
      # At least 1.
      redisReplicas: {min: 1, max: 5}
      # Only the requests and limits that the RedisFailover already sets
      # change, so the operator can resize the pods in place. cpu is in
      # millicores and memory in Mi. The range of a request must be below
      # the range of its limit, so the QoS class cannot change. A memory
      # limit must be at least 64Mi. With data, it must be at least two
      # times fill.sizeMi plus 32Mi.
      # On maxMemoryPolicy instances with data only cpu: their memory is
      # redis_memory's.
      resources:
        requests:
          cpu: {min: 25, max: 200}
          memory: {min: 32, max: 128}
        limits:
          memory: {min: 192, max: 512}
      # The share of replica and Sentinel kills that delete with
      # GracePeriodSeconds=0.
      forceDeleteProbability: 0.5
  - name: sent-basic
    namespace: sent-basic
    mode: sentinel
    mutations:
      kinds:
        redis_replicas: 2
        sentinel_replicas: 1
        kill_master: 2
        kill_replica: 1
        kill_sentinel: 1
        sentinel_toggle: 1
      redisReplicas: {min: 1, max: 5}
      # At least 3.
      sentinelReplicas: {min: 3, max: 5}
      forceDeleteProbability: 0.5
  - name: op-noevict
    namespace: op-noevict
    mode: operator
    maxMemoryPolicy: noeviction
    data:
      fill: {percent: 70, ttl: 24h}
      ledger: {}
    mutations:
      kinds:
        # The memory limit of the redis container within redisMemory (Mi),
        # and the memory request by the same ratio.
        redis_memory: 2
        # spec.redis.maxMemory.policy, to another of maxMemoryPolicies.
        maxmemory_policy: 1
        # spec.redis.maxMemory.percent within maxMemoryPercent (10-95).
        maxmemory_percent: 2
        # Write past maxmemory until rejected, keep trying for
        # fillBurstHold, then delete the burst keys. noeviction only.
        fill_burst: 2
      redisMemory: {min: 128, max: 256}
      maxMemoryPolicies: [noeviction, volatile-lru, volatile-ttl]
      maxMemoryPercent: {min: 10, max: 95}
      fillBurstHold: 10s
  # Every client authenticates while the RedisFailover has
  # spec.auth.secretPath, with the current password of the Secret.
  - name: op-full
    namespace: op-full
    mode: operator
    # The Secret auth_add creates or updates and names in
    # spec.auth.secretPath; default <name>-auth.
    authSecret: op-full-auth
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        # A new random password in the Secret that spec.auth.secretPath names.
        password_rotate: 2
        # Set or remove spec.auth.secretPath; auth_add creates authSecret.
        auth_add: 1
        auth_remove: 1
        # Scenario C: rotate while the operator is scaled to 0, expect
        # "unable to apply the configured password", put the previous
        # password back, expect Healthy, rotate again. The mutations of all
        # other instances wait meanwhile.
        password_rotate_offline: 1
  # Replicates from the master of op-basic: spec.bootstrapNode.host is the
  # ClusterIP of rfrm-op-basic. It is read-only, so it has no data. Its
  # rfrs probes read the key that the probes of op-basic write.
  - name: bootstrap
    namespace: bootstrap
    mode: operator
    bootstrap:
      # A configured instance with a ledger.
      source: op-basic
      # The number of op-basic ledger keys that each verification reads
      # from each pod.
      sampleKeys: 100
      # Verify after this time without a verification after a mutation.
      verifyInterval: 1m
    mutations:
      # Only redis_replicas, redis_resources and kill_replica.
      kinds:
        redis_replicas: 1
        kill_replica: 1
      redisReplicas: {min: 1, max: 3}
  # The tester makes this instance from a RedisFailover manifest next to
  # this file, if the instance does not exist, and resets it from the
  # manifest. Its namespace must exist.
  - name: migrate
    namespace: migrate
    mode: sentinel
    template: rf-migrate.yaml
    # The part of the graph that image_upgrade moves the instance through:
    # start (in turn for each reset), the versions that it can run,
    # optionally only the edges of some expectations, and sentinel: follow
    # (the Sentinel image changes with the redis image), separate
    # (sentinel_image_upgrade moves it towards the version of the redis
    # image) or empty (the image of the template).
    # Without a chain, version and sentinelVersion set the images.
    chain:
      start: [redis-7.2]
      versions: [redis-7.2, valkey-7.2, valkey-8]
      sentinel: separate
    mutations:
      kinds:
        # Follow an edge of the chain; at its end, reset.
        image_upgrade: 2
        sentinel_image_upgrade: 1
        # Recreate the instance, its volumes and its auth Secret from its
        # template, on the next start version of the chain.
        reset: 1
