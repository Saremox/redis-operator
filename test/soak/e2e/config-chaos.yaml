# The kind-e2e config for E2E_PROFILE=chaos: the chaos lane on a control
# plane and two workers, with four small instances that the tester creates
# from the rf-chaos-*.yaml and rf-mixed-sent.yaml templates. Seed 54 takes
# operator_restart, operator_upgrade, a node_drain of the second worker,
# operator_upgrade again and a drain of the first worker. Each action
# starts 60-90s after the previous one converged. At the same time,
# mixed-sent flips its Sentinel image between Valkey 9 and Redis 7.2.
# kind-e2e sets the upgrade versions and sets stopAfter to DURATION.
operator:
  namespace: redis-operator
  deployment: redis-operator
observer:
  interval: 5s
  convergenceTimeout: 5m
mutation:
  interval: 90s
  jitter: 30s
  seed: 54
  stopAfter: 1500s
chaos:
  kinds:
    operator_restart: 1
    operator_upgrade: 1
    node_drain: 1
  interval: 60s
  jitter: 30s
  timeout: 5m
  upgrade:
    # kind-e2e replaces both with the versions that it built, or with the RCs.
    versions:
      - {name: from, chart: chart-from.tgz, image: "redis-operator:from"}
      - {name: to, chart: chart-to.tgz, image: "redis-operator:to"}
  drain:
    hold: 30s
    timeout: 3m
versions:
  - {name: redis-7.2, image: "redis:7.2.16-alpine"}
  - {name: valkey-9, image: "valkey/valkey:9.1.2-alpine"}
instances:
  # Operator-managed failover on emptyDir.
  - name: chaos-op
    namespace: chaos-op
    mode: operator
    template: rf-chaos-op.yaml
    version: redis-7.2
    data:
      fill: {sizeMi: 8}
      ledger: {}
  # Three pods with auth, on volumes that move with the pods. Its budget
  # lets a drain evict one pod at a time.
  - name: chaos-pvc
    namespace: chaos-pvc
    mode: operator
    template: rf-chaos-pvc.yaml
    version: redis-7.2
    data:
      fill: {sizeMi: 8}
      ledger: {}
  - name: chaos-sent
    namespace: chaos-sent
    mode: sentinel
    template: rf-chaos-sent.yaml
    version: redis-7.2
    sentinelVersion: redis-7.2
    data:
      fill: {sizeMi: 8}
      ledger: {}
  # Redis 7.2 data whose Sentinels flip between Valkey 9 and Redis 7.2.
  - name: mixed-sent
    namespace: mixed-sent
    mode: sentinel
    template: rf-mixed-sent.yaml
    version: redis-7.2
    sentinelVersion: valkey-9
    data:
      fill: {sizeMi: 8}
      ledger: {}
    mutations:
      kinds:
        sentinel_image_flip: 1
      sentinelImages: [valkey-9, redis-7.2]
