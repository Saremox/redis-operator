# The RedisFailover template of the chaos-pvc instance. The kind-e2e
# shared-path StorageClass keeps its volumes in a directory that all nodes
# mount, so its pods move to a different node as on network storage.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: chaos-pvc
spec:
  sentinel:
    enabled: false
  auth:
    secretPath: chaos-pvc-auth
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-data
        spec:
          storageClassName: shared-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 256Mi
