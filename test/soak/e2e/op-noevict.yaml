apiVersion: v1
kind: Namespace
metadata:
  name: op-noevict
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: op-noevict
  namespace: op-noevict
spec:
  sentinel:
    enabled: false
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 192Mi
    maxMemory:
      percent: 75
      policy: noeviction
