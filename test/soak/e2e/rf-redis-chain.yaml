# The RedisFailover template of the redis-chain instance. The tester sets its
# name, namespace and images.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redis-chain
spec:
  sentinel:
    enabled: false
  auth:
    secretPath: redis-chain-auth
  redis:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 128Mi
