# The kind-e2e config: deploy/config.yaml with a short mutation interval
# and a fixed seed. Seed 24080 picks each enabled kind within the first
# eight steps of each instance, and within the first twelve of op-full. On
# op-full, it rotates the password with three pods, runs scenario C on step
# 5, and restarts the single pod gracefully on step 8. It also kills the
# only pod of op-basic (a reset), and the master of toggle in both modes.
# kind-e2e sets stopAfter to DURATION.
operator:
  namespace: redis-operator
  deployment: redis-operator
observer:
  interval: 5s
  # Longer than the 5m that the operator retries an in-place resize that
  # the kubelet refuses (for example, a memory limit below the page cache in
  # use) before it recreates the pod.
  convergenceTimeout: 8m
mutation:
  interval: 10s
  jitter: 10s
  seed: 24080
  stopAfter: 900s
instances:
  - name: op-basic
    namespace: op-basic
    mode: operator
    data:
      fill: {sizeMi: 32}
      ledger: {}
    mutations:
      kinds:
        redis_replicas: 2
        redis_resources: 2
        kill_master: 1
        kill_master_force: 1
        kill_replica: 1
      redisReplicas: {min: 1, max: 5}
      # The memory limit stays above two times the data plus the reserve,
      # because a full sync can double the data.
      resources:
        requests:
          cpu: {min: 25, max: 200}
          memory: {min: 32, max: 128}
        limits:
          memory: {min: 192, max: 512}
      forceDeleteProbability: 0.5
  - name: sent-basic
    namespace: sent-basic
    mode: sentinel
    data:
      fill: {sizeMi: 32}
      ledger: {}
    mutations:
      kinds:
        redis_replicas: 2
        sentinel_replicas: 1
        kill_master: 1
        kill_master_force: 1
        kill_replica: 1
        kill_sentinel: 1
      redisReplicas: {min: 1, max: 5}
      sentinelReplicas: {min: 3, max: 5}
      forceDeleteProbability: 0.5
  # allkeys-lru at 75% of 256Mi, filled to 90% of maxmemory. Filler only,
  # because allkeys-* can evict ledger keys.
  - name: op-maxmem
    namespace: op-maxmem
    mode: operator
    maxMemoryPolicy: allkeys-lru
    data:
      fill: {percent: 90}
    mutations:
      kinds:
        redis_memory: 2
        maxmemory_policy: 1
        maxmemory_percent: 2
        kill_replica: 1
      redisMemory: {min: 160, max: 320}
      maxMemoryPolicies: [allkeys-lru, allkeys-lfu, allkeys-random]
      maxMemoryPercent: {min: 10, max: 95}
      forceDeleteProbability: 0.5
  # noeviction at 75% of 192Mi, filled to 70% of maxmemory, with the
  # ledger. Fill keys have a TTL, so volatile-* evicts only fill keys.
  - name: op-noevict
    namespace: op-noevict
    mode: operator
    maxMemoryPolicy: noeviction
    data:
      fill: {percent: 70, ttl: 1h}
      ledger: {}
    mutations:
      kinds:
        redis_memory: 2
        maxmemory_policy: 1
        maxmemory_percent: 2
        fill_burst: 2
      redisMemory: {min: 128, max: 256}
      maxMemoryPolicies: [noeviction, volatile-lru, volatile-ttl]
      maxMemoryPercent: {min: 10, max: 95}
  # PVCs and auth. The mutator rotates, removes and adds the password, and
  # changes it while the operator is stopped (scenario C).
  - name: op-full
    namespace: op-full
    mode: operator
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        password_rotate: 2
        auth_remove: 1
        auth_add: 1
        password_rotate_offline: 1
        kill_master: 2
        kill_master_force: 1
        redis_replicas: 2
      # A graceful restart of a single pod with a volume must lose nothing.
      redisReplicas: {min: 1, max: 2}
  - name: sent-full
    namespace: sent-full
    mode: sentinel
    port: 6380
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        password_rotate: 2
        kill_master: 1
        kill_sentinel: 1
        sentinel_replicas: 1
      sentinelReplicas: {min: 3, max: 4}
      forceDeleteProbability: 0.5
  # Starts without Sentinel. Its probe paths follow the mode.
  - name: toggle
    namespace: toggle
    mode: operator
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        sentinel_toggle: 2
        kill_master: 1
  # Read-only. Replicates from the master of op-basic through rfrm-op-basic.
  - name: bootstrap
    namespace: bootstrap
    mode: operator
    bootstrap: {source: op-basic}
    mutations:
      kinds:
        redis_replicas: 1
        kill_replica: 1
      redisReplicas: {min: 1, max: 3}
      forceDeleteProbability: 0.5
