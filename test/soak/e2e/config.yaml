# kind-e2e's config: deploy/config.yaml with a short mutation interval and a
# fixed seed. Seed 629 picks every enabled kind within the first five steps
# of both instances. kind-e2e sets stopAfter to DURATION.
operator:
  namespace: redis-operator
  deployment: redis-operator
observer:
  interval: 5s
  convergenceTimeout: 5m
mutation:
  interval: 10s
  jitter: 10s
  minDwell: 15s
  seed: 629
  stopAfter: 600s
instances:
  - name: op-basic
    namespace: op-basic
    mode: operator
    mutations:
      kinds:
        redis_replicas: 2
        redis_resources: 2
        kill_master: 2
        kill_replica: 1
      redisReplicas: {min: 1, max: 5}
      resources:
        requests:
          cpu: {min: 25, max: 200}
          memory: {min: 32, max: 128}
        limits:
          memory: {min: 192, max: 512}
      forceDeleteProbability: 0.5
  - name: sent-basic
    namespace: sent-basic
    mode: sentinel
    mutations:
      kinds:
        redis_replicas: 2
        sentinel_replicas: 1
        kill_master: 2
        kill_replica: 1
        kill_sentinel: 1
      redisReplicas: {min: 1, max: 5}
      sentinelReplicas: {min: 3, max: 5}
      forceDeleteProbability: 0.5
