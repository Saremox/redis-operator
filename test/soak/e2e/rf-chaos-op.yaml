# The RedisFailover template of the chaos-op instance. The tester sets its
# name, namespace and images.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: chaos-op
spec:
  sentinel:
    enabled: false
  redis:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
