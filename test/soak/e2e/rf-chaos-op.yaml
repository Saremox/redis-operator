# The chaos-op instance's RedisFailover; the tester sets its name, namespace
# and images, and creates it from this template.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: chaos-op
spec:
  sentinel:
    enabled: false
  redis:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
