apiVersion: v1
kind: Namespace
metadata:
  name: op-maxmem
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: op-maxmem
  namespace: op-maxmem
spec:
  sentinel:
    enabled: false
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    maxMemory:
      percent: 75
      policy: allkeys-lru
