apiVersion: v1
kind: Namespace
metadata:
  name: toggle
---
apiVersion: v1
kind: Secret
metadata:
  name: toggle-auth
  namespace: toggle
stringData:
  password: toggle-initial
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: toggle
  namespace: toggle
spec:
  auth:
    secretPath: toggle-auth
  sentinel:
    enabled: false
    replicas: 3
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
