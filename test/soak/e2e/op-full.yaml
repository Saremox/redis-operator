apiVersion: v1
kind: Namespace
metadata:
  name: op-full
---
apiVersion: v1
kind: Secret
metadata:
  name: op-full-auth
  namespace: op-full
stringData:
  password: op-full-initial
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: op-full
  namespace: op-full
spec:
  sentinel:
    enabled: false
  auth:
    secretPath: op-full-auth
  redis:
    replicas: 3
    preventMasterEviction: true
    exporter:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 256Mi
