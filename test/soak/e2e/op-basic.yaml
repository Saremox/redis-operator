apiVersion: v1
kind: Namespace
metadata:
  name: op-basic
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: op-basic
  namespace: op-basic
spec:
  sentinel:
    enabled: false
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
