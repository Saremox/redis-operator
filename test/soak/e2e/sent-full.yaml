apiVersion: v1
kind: Namespace
metadata:
  name: sent-full
---
apiVersion: v1
kind: Secret
metadata:
  name: sent-full-auth
  namespace: sent-full
stringData:
  password: sent-full-initial
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: sent-full
  namespace: sent-full
spec:
  auth:
    secretPath: sent-full-auth
  sentinel:
    enabled: true
    replicas: 3
    exporter:
      enabled: true
    customConfig:
      - down-after-milliseconds 4000
      - failover-timeout 9000
      - parallel-syncs 1
  redis:
    port: 6380
    replicas: 3
    exporter:
      enabled: true
    customConfig:
      - hz 20
      - slowlog-log-slower-than 20000
      - maxmemory-samples 7
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
