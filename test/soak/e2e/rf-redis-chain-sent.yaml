# The RedisFailover template of the redis-chain-sent instance. The tester sets its
# name, namespace and images.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: redis-chain-sent
spec:
  sentinel:
    enabled: true
    replicas: 3
  auth:
    secretPath: redis-chain-sent-auth
  redis:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
