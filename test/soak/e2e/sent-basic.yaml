apiVersion: v1
kind: Namespace
metadata:
  name: sent-basic
---
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: sent-basic
  namespace: sent-basic
spec:
  sentinel:
    enabled: true
    replicas: 3
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
