# The rights of the chaos lane. operator_restart deletes the operator pods
# and reads the Lease of the leader. operator_upgrade runs helm upgrade on
# the operator release: helm keeps the release in Secrets, manages the
# chart objects and runs the CRD hook Job. The namespace and the release
# must match `operator` and `chaos.upgrade` in config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-soak-chaos
  namespace: redis-operator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak-chaos
  namespace: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-soak-chaos
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
# helm can create or update the ClusterRoles of the chart only if it holds
# the rights that they grant, or escalate and bind. This is equal to
# cluster-admin, so use it only on a cluster that exists for the soak test.
# node_drain cordons nodes and evicts their pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-soak-chaos
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The upgrade logs the CRD generation before and after the hook.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-soak-chaos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-soak-chaos
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
