apiVersion: apps/v1
kind: Deployment
metadata:
  name: soak
  namespace: redis-soak
  labels:
    app.kubernetes.io/name: redis-soak
spec:
  replicas: 1
  # A second tester writes the same probe keys.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-soak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-soak
    spec:
      serviceAccountName: soak
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soak
          image: ghcr.io/saremox/redis-operator-soak
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/soak/config.yaml
          env:
            # A drain never picks the node of the tester.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The helm cache and config, for operator_upgrade.
            - name: HOME
              value: /tmp
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/soak
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: soak-config
        - name: tmp
          emptyDir: {}
