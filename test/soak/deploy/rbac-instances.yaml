# Grants the mutator its rules in every instance's namespace. Keep one
# RoleBinding per instance namespace in config.yaml; the namespaces must
# exist before this is applied.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak-mutator
  namespace: op-basic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-soak-mutator
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak-mutator
  namespace: sent-basic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-soak-mutator
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
