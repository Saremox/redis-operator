# The valkey-op instance's RedisFailover; the tester sets its name, namespace
# and images, and creates or resets it from this template.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: valkey-op
spec:
  sentinel:
    enabled: false
  auth:
    secretPath: valkey-op-auth
  redis:
    replicas: 3
    exporter:
      enabled: true
    maxMemory:
      policy: allkeys-lfu
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 256Mi
