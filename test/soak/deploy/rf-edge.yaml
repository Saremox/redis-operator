# The RedisFailover template of the edge instance. The tester sets its
# name, namespace and images.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: edge
spec:
  sentinel:
    enabled: false
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
