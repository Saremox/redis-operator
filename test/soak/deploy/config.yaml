operator:
  namespace: redis-operator
  deployment: redis-operator
observer:
  interval: 5s
  convergenceTimeout: 10m
mutation:
  interval: 2m
  jitter: 1m
  minDwell: 15s
instances:
  - name: op-basic
    namespace: op-basic
    mode: operator
    data:
      fill: {sizeMi: 32}
      ledger: {}
    mutations:
      kinds:
        redis_replicas: 2
        redis_resources: 2
        kill_master: 1
        kill_master_force: 1
        kill_replica: 1
      redisReplicas: {min: 1, max: 5}
      resources:
        requests:
          cpu: {min: 25, max: 200}
          memory: {min: 32, max: 128}
        limits:
          memory: {min: 192, max: 512}
      forceDeleteProbability: 0.5
  - name: sent-basic
    namespace: sent-basic
    mode: sentinel
    data:
      fill: {sizeMi: 32}
      ledger: {}
    mutations:
      kinds:
        redis_replicas: 2
        sentinel_replicas: 1
        kill_master: 1
        kill_master_force: 1
        kill_replica: 1
        kill_sentinel: 1
      redisReplicas: {min: 1, max: 5}
      sentinelReplicas: {min: 3, max: 5}
      forceDeleteProbability: 0.5
  - name: op-maxmem
    namespace: op-maxmem
    mode: operator
    maxMemoryPolicy: allkeys-lru
    data:
      fill: {percent: 90}
    mutations:
      kinds:
        redis_memory: 2
        maxmemory_policy: 1
        maxmemory_percent: 2
        kill_replica: 1
      redisMemory: {min: 160, max: 320}
      maxMemoryPolicies: [allkeys-lru, allkeys-lfu, allkeys-random]
      maxMemoryPercent: {min: 10, max: 95}
      forceDeleteProbability: 0.5
  - name: op-noevict
    namespace: op-noevict
    mode: operator
    maxMemoryPolicy: noeviction
    data:
      fill: {percent: 70, ttl: 24h}
      ledger: {}
    mutations:
      kinds:
        redis_memory: 2
        maxmemory_policy: 1
        maxmemory_percent: 2
        fill_burst: 2
      redisMemory: {min: 128, max: 256}
      maxMemoryPolicies: [noeviction, volatile-lru, volatile-ttl]
      maxMemoryPercent: {min: 10, max: 95}
  # With PVCs and auth (secret op-full-auth): the password is rotated,
  # removed and added, and changed while the operator is stopped.
  - name: op-full
    namespace: op-full
    mode: operator
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        password_rotate: 2
        auth_remove: 1
        auth_add: 1
        password_rotate_offline: 1
        kill_master: 2
        kill_master_force: 1
        redis_replicas: 2
      redisReplicas: {min: 1, max: 3}
  # Sentinel, auth, port 6380, exporters and customConfig.
  - name: sent-full
    namespace: sent-full
    mode: sentinel
    port: 6380
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        password_rotate: 2
        kill_master: 1
        kill_sentinel: 1
        sentinel_replicas: 1
      sentinelReplicas: {min: 3, max: 5}
      forceDeleteProbability: 0.5
  # Created without Sentinel; Sentinel is switched on and off.
  - name: toggle
    namespace: toggle
    mode: operator
    data:
      fill: {sizeMi: 16}
      ledger: {}
    mutations:
      kinds:
        sentinel_toggle: 2
        kill_master: 1
  # spec.bootstrapNode.host is the ClusterIP of rfrm-op-basic.
  - name: bootstrap
    namespace: bootstrap
    mode: operator
    bootstrap: {source: op-basic}
    mutations:
      kinds:
        redis_replicas: 1
        kill_replica: 1
      redisReplicas: {min: 1, max: 3}
      forceDeleteProbability: 0.5
