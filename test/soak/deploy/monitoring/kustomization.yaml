apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# For a Prometheus Operator and Grafana: the ServiceMonitor, the alerts,
# and the dashboard as a ConfigMap. The Grafana dashboard sidecar finds the
# ConfigMap by its grafana_dashboard label. Apply this after ../.
resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: redis-soak-dashboard
    namespace: redis-soak
    files:
      - dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
