# honorLabels keeps the namespace and pod labels of the tester, because
# they identify the namespace and the redis pods of an instance, not the
# scrape target.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-soak
  namespace: redis-soak
  labels:
    app.kubernetes.io/name: redis-soak
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-soak
  endpoints:
    - port: metrics
      interval: 15s
      honorLabels: true
