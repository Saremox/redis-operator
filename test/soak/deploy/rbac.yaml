# Reads the image tag of the operator Deployment for redis_soak_build_info,
# and scales the Deployment to 0 and back for password_rotate_offline. The
# namespace and resourceNames must match `operator` in config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-soak
  namespace: redis-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["redis-operator"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["redis-operator"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak
  namespace: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
# The observer reads the RedisFailover, the pods and the rfrm
# EndpointSlices of each instance. Scenario C and the chaos lane read the
# operator pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-soak
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["databases.spotahome.com"]
    resources: ["redisfailovers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-soak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
# The mutator, and the auth Secrets that give each client its password, in
# the namespace of the instances.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-soak-mutator
  namespace: redis-soak-instances
rules:
  # The tester creates and resets the instances from their templates.
  - apiGroups: ["databases.spotahome.com"]
    resources: ["redisfailovers"]
    verbs: ["patch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # The tester judges a version change that did not converge by the pod logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # A reset deletes the volumes of the instance.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get"]
  # The tester and auth_add create the auth Secrets. A reset deletes and
  # creates them again.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak-mutator
  namespace: redis-soak-instances
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-soak-mutator
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
