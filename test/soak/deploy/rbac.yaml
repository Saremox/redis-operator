# Reads the operator Deployment's image tag for redis_soak_build_info.
# Namespace and resourceNames must match `operator` in config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-soak
  namespace: redis-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["redis-operator"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak
  namespace: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
# The observer reads every instance's RedisFailover, pods and the rfrm
# EndpointSlices. The instances live in namespaces of their own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-soak
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["databases.spotahome.com"]
    resources: ["redisfailovers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-soak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
