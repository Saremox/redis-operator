# Reads the operator Deployment's image tag for redis_soak_build_info.
# Namespace and resourceNames must match `operator` in config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-soak
  namespace: redis-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["redis-operator"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak
  namespace: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
