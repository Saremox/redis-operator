# Reads the operator Deployment's image tag for redis_soak_build_info, and
# scales it to 0 and back for password_rotate_offline. Namespace and
# resourceNames must match `operator` in config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-soak
  namespace: redis-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["redis-operator"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["redis-operator"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-soak
  namespace: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
# The observer reads every instance's RedisFailover, pods and the rfrm
# EndpointSlices. The instances live in namespaces of their own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-soak
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["databases.spotahome.com"]
    resources: ["redisfailovers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-soak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-soak
subjects:
  - kind: ServiceAccount
    name: soak
    namespace: redis-soak
---
# The mutator's rules, and the auth Secrets every client reads its password
# from. They are granted only in the instances' namespaces, by the
# RoleBindings in rbac-instances.yaml: a ClusterRole keeps one copy of the
# rules for every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-soak-mutator
rules:
  # Instances with a template are created, and reset, by the tester.
  - apiGroups: ["databases.spotahome.com"]
    resources: ["redisfailovers"]
    verbs: ["patch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # A version change that didn't converge is judged by its pods' logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # A reset deletes the instance's volumes.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get"]
  # auth_add creates the Secret it names; a reset deletes and recreates
  # the one its template names.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
