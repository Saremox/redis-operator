apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global namespace: the Role lives in the operator's namespace and the
# mutator's RoleBindings in the instances'.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - rbac-instances.yaml
  - rbac-chaos.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: soak-config
    namespace: redis-soak
    files:
      - config.yaml
      # The templates of the instances the tester creates and resets.
      - rf-redis-chain.yaml
      - rf-redis-chain-sent.yaml
      - rf-migrate.yaml
      - rf-migrate-sent.yaml
      - rf-edge.yaml
      - rf-valkey-op.yaml
      - rf-valkey-sent.yaml
      - rf-mixed-sent.yaml
