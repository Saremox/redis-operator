apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global namespace: the Role is in the operator namespace, and the
# mutator RoleBindings are in the instance namespaces. To enable the chaos
# lane, add the opt-in component chaos/ under components.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - rbac-instances.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: soak-config
    namespace: redis-soak
    files:
      - config.yaml
      # The templates of the instances that the tester creates and resets.
      - rf-redis-chain.yaml
      - rf-redis-chain-sent.yaml
      - rf-migrate.yaml
      - rf-migrate-sent.yaml
      - rf-edge.yaml
      - rf-valkey-op.yaml
      - rf-valkey-sent.yaml
      - rf-mixed-sent.yaml
