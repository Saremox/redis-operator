apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global namespace: the Role is in the operator namespace. To enable the
# chaos lane, add the opt-in component chaos/ under components.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: soak-config
    namespace: redis-soak
    files:
      - config.yaml
      - instances.yaml
