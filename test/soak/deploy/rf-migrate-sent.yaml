# The migrate-sent instance's RedisFailover; the tester sets its name, namespace
# and images, and creates or resets it from this template.
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: migrate-sent
spec:
  sentinel:
    enabled: true
    replicas: 3
  auth:
    secretPath: migrate-sent-auth
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 128Mi
